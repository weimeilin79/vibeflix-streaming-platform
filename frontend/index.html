<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The V-and-ribbon mark from the lockup, generated from logo.svg by
         keeping only its saturated paths and dropping the grey wordmark: a
         rectangular crop of the artwork cannot avoid the letters, because the
         ribbon's tail sweeps right behind "ibe".

         Replaces an emoji favicon, which rendered from the viewer's own OS
         font and so was a different picture on every platform. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibetube — Modern Video Streaming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Sans Flex with Roboto behind it.
         Roboto is what YouTube actually serves for UI text (`Roboto, Arial,
         sans-serif`, weights 300/400/500/700); its display face, YouTube Sans,
         is proprietary and not licensed for use here. Google Sans Flex is the
         nearest public equivalent and ships as one variable file covering
         300-900, so the whole weight range costs a single download.

         Listing Roboto second is close to free: browsers fetch a @font-face
         file only when it is needed to render something, so these are not
         downloaded while Google Sans Flex is covering the text. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..900&family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- hls.js is required: VideoPlayerModal reads window.Hls to play the
         transcoder's .m3u8 output. -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
